<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Photo library map</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:1rem;background:#f4f6f7}h1{font-size:1.2rem}p{color:#555}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #dde}figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}figcaption{padding:.5rem .7rem;font-weight:700}</style></head>
<body><h1>Photo library</h1><p>Each photo's number is what you use as <code>img:N</code> in <code>js/demo-data.js</code> or <code>js/images.js</code>.</p><div class="g" id="g"></div>
<script src="js/images.js"></script><script>document.getElementById('g').innerHTML=SG.images.urls.map((u,i)=>`<figure><img src="${SG.images.url(i+1,500)}" alt="Photo ${i+1}" loading="lazy"><figcaption>img:${i+1}</figcaption></figure>`).join('')</script></body></html>
